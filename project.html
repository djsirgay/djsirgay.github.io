<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#060606" />
  <meta name="description" content="Listen to a DJ Sir Gay project and read the story behind the sound." />
  <link rel="canonical" href="https://djsirgay.com/project.html" />
  <title>DJ Sir Gay — Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#060606;--panel:#101010;--text:#f4f1ea;--muted:#9d9b96;--line:rgba(255,255,255,.13);--acid:#b8ff35;--max:1180px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
    .header{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line);background:rgba(6,6,6,.86);backdrop-filter:blur(18px)}
    .header-in{width:min(var(--max),calc(100% - 32px));height:68px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.wordmark{font-family:"Archivo Black",Impact,sans-serif;font-size:17px}.back,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.btn:hover,.back:hover{border-color:var(--acid)}.btn.primary{background:var(--acid);border-color:var(--acid);color:#070707}.btn.youtube{background:#fff;color:#060606;border-color:#fff}
    .main{width:min(var(--max),calc(100% - 32px));margin:auto;padding:30px 0 90px}.player{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:#000}.player iframe{width:100%;height:100%;border:0}
    .intro{display:grid;grid-template-columns:1.06fr .94fr;gap:18px;margin-top:18px}.visual,.copy,.story-card{overflow:hidden;border:1px solid var(--line);border-radius:26px;background:var(--panel)}.visual{min-height:430px}.visual img{width:100%;height:100%;object-fit:cover;filter:saturate(.88) contrast(1.04)}.copy{padding:clamp(26px,4vw,48px)}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--acid)}h1{margin:15px 0 8px;font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(48px,7vw,92px);line-height:.85;letter-spacing:-.06em;text-transform:uppercase}h2{margin:0;color:#d0cdc7;font-size:clamp(21px,2.7vw,32px);font-weight:500}.summary{margin:25px 0 0;color:#c5c2bb;font-size:18px;line-height:1.6}.meta,.actions{display:flex;flex-wrap:wrap;gap:8px}.meta{margin-top:22px}.meta span{padding:8px 10px;border:1px solid var(--line);border-radius:999px;color:#8d8b85;font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.actions{margin-top:26px}
    .story{display:grid;gap:12px;margin-top:18px}.story-card{padding:clamp(22px,3vw,34px)}.story-card p{margin:0;color:#d0cdc7;font-size:clamp(17px,2vw,21px);line-height:1.7}.story-card:first-child{border-left:4px solid var(--acid)}
    .more-head{margin:58px 0 20px}.more-head small{color:var(--acid);font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.more-head h3{margin:8px 0 0;font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(42px,6vw,72px);line-height:.88;letter-spacing:-.055em;text-transform:uppercase}.more{display:grid;grid-auto-flow:column;grid-auto-columns:min(78vw,360px);gap:13px;overflow-x:auto;padding-bottom:16px;scroll-snap-type:x mandatory;scrollbar-width:none}.more::-webkit-scrollbar{display:none}.mini{scroll-snap-align:start;min-height:190px;padding:22px;border:1px solid var(--line);border-radius:22px;background:var(--panel)}.mini:hover{border-color:var(--acid)}.mini p{margin:0;color:#88867f;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.mini h4{margin:50px 0 0;font-family:"Archivo Black",Impact,sans-serif;font-size:28px;line-height:.94;text-transform:uppercase}
    @media(max-width:820px){.intro{grid-template-columns:1fr}.visual{min-height:320px}.main{width:calc(100% - 28px)}.header-in{width:calc(100% - 28px)}.back{font-size:8px;padding:0 11px}.player,.visual,.copy,.story-card{border-radius:21px}.copy{padding:27px 22px}.summary{font-size:16px}}
  </style>
</head>
<body>
  <header class="header"><div class="header-in"><a class="wordmark" href="/">DJ SIR GAY</a><a class="back" href="/#projects">← Back to projects</a></div></header>
  <main class="main">
    <section class="player" id="player"></section>
    <section class="intro"><div class="visual" id="visual"></div><div class="copy" id="copy"></div></section>
    <section class="story" id="story"></section>
    <div class="more-head"><small>Keep listening</small><h3>Other projects</h3></div>
    <section class="more" id="more"></section>
  </main>
  <script>
    const projects=[
      {slug:'belarus-in-exile',eyebrow:'BURNING MAN 2025 / NARRATIVE DJ SET',title:'BELARUS IN EXILE',subtitle:'From Dictatorship to the Dancefloor',short:'A two-hour journey through 55 Belarusian-language tracks — memory, resistance, desire and release, rebuilt for the playa.',story:['This is not nostalgia. It is a country carried through sound.','Created for the first Belarusian camp at Burning Man 2025, the mix moves through homeland, pressure, rupture, escape, exile and the freedom of the dancefloor.','Fifty-five Belarusian-language tracks become one continuous statement against censorship and the forced disappearance of artists. Culture survives when people keep hearing it.'],meta:['2:18:17','55 Belarusian tracks','Burning Man 2025'],youtube:'https://youtu.be/5QEXd8XTPM0',embed:'5QEXd8XTPM0',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/5QEXd8XTPM0/maxresdefault.jpg'},
      {slug:'fresh-mashups',eyebrow:'CONTINUOUSLY UPDATED',title:'FRESH MASHUPS',subtitle:'New collisions. No genre borders.',short:'The newest DJ Sir Gay reworks, organized as a living stream rather than a static archive.',story:['Pop memory meets the wrong song at exactly the right moment.','The feed moves between global pop, queer classics, Eastern European hits and cinematic references, following the dedicated YouTube playlist.','Familiar material is not preserved unchanged. It is placed into a new emotional and rhythmic context — sometimes responsibly.'],meta:['Playlist-controlled','New releases','No genre borders'],youtube:'https://www.youtube.com/playlist?list=PL0CwuGTt2ZV2v4CGRTtYyaWYyCEoC2vPU',embed:'videoseries?list=PL0CwuGTt2ZV2v4CGRTtYyaWYyCEoC2vPU',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/24_RoSB5I1w/maxresdefault.jpg'},
      {slug:'serebro-925',eyebrow:'LIVE ALBUM / PART I',title:'SEREBRO — 925',subtitle:'DJ Sir Gay MixTape',short:'A continuous high-gloss mixtape rebuilding SEREBRO’s catalog through mashups, re-edits and club transitions.',story:['SEREBRO — 925 treats a pop catalog as raw material for a new live album.','Vocals are reframed through alternate instrumentals, hard cuts, extended transitions and redesigned peaks. Instead of a list of songs, the project behaves like one performance.','Part I introduces the world of 925: metallic, emotional, playful and designed to move in one uninterrupted line.'],meta:['Live mixtape','Part I','Pop reconstruction'],youtube:'https://youtu.be/Mc3C-jRqcP8',embed:'Mc3C-jRqcP8',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/Mc3C-jRqcP8/maxresdefault.jpg'},
      {slug:'tatu-wm',eyebrow:'ANNIVERSARY REWORK',title:'t.A.T.u. — WM',subtitle:'10th Anniversary Version',short:'A darker, cinematic continuous rework of the Waste Management universe — rebuilt as one emotional trip.',story:['Waste Management was already conceived as a continuous journey. This anniversary version pushes that architecture further.','Transitions are redesigned, tension is stretched, and the colder electronic palette is treated like a film score for a night that keeps changing shape.','The result is one uninterrupted emotional system: intimate, industrial and built for headphones as much as the dancefloor.'],meta:['Continuous mix','Cinematic','Anniversary version'],youtube:'https://youtu.be/0x5QZhKwQPg',embed:'0x5QZhKwQPg',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/0x5QZhKwQPg/maxresdefault.jpg'}
    ];
    const slug=new URLSearchParams(location.search).get('slug')||projects[0].slug;
    const p=projects.find(item=>item.slug===slug)||projects[0];
    document.title=`DJ Sir Gay — ${p.title}`;
    const embed=p.embed.startsWith('videoseries')?`https://www.youtube.com/embed/${p.embed}`:`https://www.youtube.com/embed/${p.embed}?rel=0`;
    document.getElementById('player').innerHTML=`<iframe src="${embed}" title="Listen to ${p.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
    document.getElementById('visual').innerHTML=`<img src="${p.img}" alt="${p.title}">`;
    document.getElementById('copy').innerHTML=`<div class="eyebrow">${p.eyebrow}</div><h1>${p.title}</h1><h2>${p.subtitle}</h2><div class="meta">${p.meta.map(item=>`<span>${item}</span>`).join('')}</div><p class="summary">${p.short}</p><div class="actions"><a class="btn youtube" href="${p.youtube}" target="_blank" rel="noreferrer">Open on YouTube ↗</a><a class="btn" href="${p.soundcloud}" target="_blank" rel="noreferrer">SoundCloud ↗</a><a class="btn primary" href="/#booking">Book this concept</a></div>`;
    document.getElementById('story').innerHTML=p.story.map(text=>`<div class="story-card"><p>${text}</p></div>`).join('');
    document.getElementById('more').innerHTML=projects.filter(item=>item.slug!==p.slug).map(item=>`<a class="mini" href="/project.html?slug=${item.slug}"><p>${item.eyebrow}</p><h4>${item.title}</h4></a>`).join('');
  </script>
</body>
</html>
