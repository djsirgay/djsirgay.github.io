<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080806" />
  <meta name="description" content="Listen to a DJ Sir Gay project and read the story behind the signal." />
  <link rel="canonical" href="https://djsirgay.com/project.html" />
  <title>DJ Sir Gay — Project File</title>
  <link rel="icon" href="/assets/logo-square.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/project-signal.css?v=20260730-3" />
  <link rel="stylesheet" href="/mobile-overflow.css?v=20260730-3" />
  <link rel="stylesheet" href="/project-extras.css?v=20260730-3" />
  <link rel="stylesheet" href="/project-dramaturgy.css?v=20260730-3" />
</head>
<body>
  <header class="header"><div class="header-in"><a class="wordmark" href="/">DJ SIR GAY / SIGNAL FILE</a><a class="back" href="/#projects">← Back to transmissions</a></div></header>
  <main class="main">
    <p class="file-label" id="file-label">Loading project evidence / DJSG archive</p>
    <section class="player" id="player"></section>
    <section class="intro"><div class="visual" id="visual"></div><div class="copy" id="copy"></div></section>
    <section class="story" id="story"></section>
    <div class="more-head"><p>Continue intercepting</p><h3>Other project files</h3></div>
    <section class="more" id="more"></section>
  </main>
  <script>
    const projects=[
      {
        slug:'belarus-in-exile',
        eyebrow:'BURNING MAN 2025 / NARRATIVE DJ SET',
        title:'BELARUS IN EXILE',
        subtitle:'From Dictatorship to the Dancefloor',
        short:'A two-hour journey through 55 Belarusian-language tracks — memory, resistance, desire and release, rebuilt for the playa.',
        story:[
          'This is not nostalgia. It is a country carried through sound.',
          'Created for the first Belarusian camp at Burning Man 2025, the set moves through six emotional chapters: homeland, pressure, rupture, escape, exile and the freedom of the dancefloor.',
          'Fifty-five Belarusian-language tracks are reshaped through beatmatching, transitions, FX and live-set architecture into one continuous public statement. Culture survives when people keep hearing it — especially after censorship tries to make it disappear.'
        ],
        meta:['2:18:17','55 Belarusian-language tracks','Burning Man 2025','Narrative DJ set'],
        youtube:'https://youtu.be/5QEXd8XTPM0',
        embed:'5QEXd8XTPM0',
        soundcloud:'https://soundcloud.com/djsirgay',
        img:'https://i.ytimg.com/vi/5QEXd8XTPM0/hqdefault.jpg'
      },
      {
        slug:'fresh-mashups',
        eyebrow:'CONTINUOUSLY UPDATED / YOUTUBE PLAYLIST',
        title:'FRESH MASHUPS',
        subtitle:'New collisions. No genre borders.',
        short:'The newest DJ Sir Gay edits and reworks, organized as a living transmission rather than a static archive.',
        story:[
          'Pop memory meets the wrong song at exactly the right moment.',
          'Fresh Mashups moves between global pop, queer classics, Eastern European hits and unexpected cinematic references. The playlist controls both the order and the current release titles on the main site.',
          'The principle is simple: familiar material is not preserved unchanged. It is placed into a new emotional and rhythmic context, with a hook strong enough to survive the collision.'
        ],
        meta:['Playlist-controlled','Updated automatically','Mashups and reworks','No genre borders'],
        youtube:'https://www.youtube.com/playlist?list=PL0CwuGTt2ZV2v4CGRTtYyaWYyCEoC2vPU',
        embed:'videoseries?list=PL0CwuGTt2ZV2v4CGRTtYyaWYyCEoC2vPU',
        soundcloud:'https://soundcloud.com/djsirgay',
        img:'https://i.ytimg.com/vi/24_RoSB5I1w/hqdefault.jpg'
      },
      {
        slug:'serebro-925',
        eyebrow:'SEREBRO × DJ SIR GAY / LIVE ALBUM',
        title:'SEREBRO × DJ SIR GAY — 925',
        subtitle:'Live Album: Part 1',
        short:'A continuous high-gloss live album rebuilding SEREBRO through mashups, re-edits, hard cuts and club transitions.',
        story:[
          'SEREBRO × DJ Sir Gay — 925 treats a familiar pop catalog as raw material for a new live album.',
          'Vocals are reframed through alternate instrumentals, extended transitions, mashup logic and redesigned peaks. Instead of a list of songs, the project behaves like one performance with its own pace, tension and release.',
          'Part 1 introduces the world of 925: metallic, emotional, playful and designed to move in one uninterrupted line — with Sladko and other catalog moments rebuilt for a different dancefloor.'
        ],
        meta:['Live Album: Part 1','Continuous mix','Mashups and re-edits','Pop reconstruction'],
        youtube:'https://youtu.be/Mc3C-jRqcP8',
        embed:'Mc3C-jRqcP8',
        soundcloud:'https://soundcloud.com/djsirgay',
        img:'https://i.ytimg.com/vi/Mc3C-jRqcP8/hqdefault.jpg'
      },
      {
        slug:'tatu-wm',
        eyebrow:'t.A.T.u. / ANNIVERSARY REWORK',
        title:'t.A.T.u. — WM',
        subtitle:'10th Anniversary Version',
        short:'A darker, cinematic continuous reconstruction of the Waste Management universe — rebuilt as one emotional trip.',
        story:[
          'Waste Management was already conceived as a continuous journey. This anniversary version pushes that architecture further.',
          'Transitions are redesigned, tension is stretched, and the album’s colder electronic palette is treated like a film score for a night that keeps changing shape.',
          'The result is less a conventional remix collection than one uninterrupted emotional system: intimate, industrial and built for headphones as much as the dancefloor.'
        ],
        meta:['10th Anniversary Version','Continuous mix','Cinematic rework','Headphones and dancefloor'],
        youtube:'https://youtu.be/0x5QZhKwQPg',
        embed:'0x5QZhKwQPg',
        soundcloud:'https://soundcloud.com/djsirgay',
        img:'https://i.ytimg.com/vi/0x5QZhKwQPg/hqdefault.jpg'
      }
    ];

    const slug=new URLSearchParams(location.search).get('slug')||projects[0].slug;
    const p=projects.find(item=>item.slug===slug)||projects[0];
    const projectNumber=String(projects.indexOf(p)+1).padStart(2,'0');
    document.title=`DJ Sir Gay — ${p.title}`;
    document.querySelector('meta[name="description"]').content=p.short;
    document.getElementById('file-label').textContent=`Project file / ${projectNumber} of ${String(projects.length).padStart(2,'0')} / Signal recovered`;
    const embed=p.embed.startsWith('videoseries')?`https://www.youtube.com/embed/${p.embed}`:`https://www.youtube.com/embed/${p.embed}?rel=0`;
    document.getElementById('player').innerHTML=`<iframe src="${embed}" title="Listen to ${p.title}: ${p.subtitle}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
    document.getElementById('visual').innerHTML=`<img src="${p.img}" alt="${p.title} — ${p.subtitle}">`;
    document.getElementById('copy').innerHTML=`<div><div class="eyebrow">${p.eyebrow}</div><h1>${p.title}</h1><h2>${p.subtitle}</h2><div class="meta">${p.meta.map(item=>`<span>${item}</span>`).join('')}</div><p class="summary">${p.short}</p></div><div class="actions"><a class="btn primary" href="${p.youtube}" target="_blank" rel="noreferrer">Open on YouTube ↗</a><a class="btn" href="${p.soundcloud}" target="_blank" rel="noreferrer">SoundCloud ↗</a><a class="btn" href="/#booking">Book this signal</a></div>`;
    document.getElementById('story').innerHTML=p.story.map(text=>`<article class="log"><p>${text}</p></article>`).join('');
    document.getElementById('more').innerHTML=projects.filter(item=>item.slug!==p.slug).map(item=>`<a class="mini" href="/project.html?slug=${item.slug}"><div class="mini-image"><img src="${item.img}" alt="${item.title}" loading="lazy"></div><div class="mini-copy"><p>${item.eyebrow}</p><h4>${item.title}</h4><span>${item.subtitle} →</span></div></a>`).join('');
  </script>
</body>
</html>
