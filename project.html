<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ Sir Gay — Project Story</title><meta name="description" content="Project story by DJ Sir Gay."><link rel="canonical" href="https://djsirgay.com/project.html"><style>:root{--bg:#07070a;--ink:#f7f4ee;--muted:#aaa5b3;--line:rgba(255,255,255,.12);--lime:#d7ff3f;--yellow:#e7d64c;--orange:#ff922e;--blue:#48bff2;--violet:#8d6bff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}.header{position:sticky;top:0;z-index:40;background:rgba(7,7,10,.76);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.header-in{max-width:1120px;margin:auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}.wordmark{font-weight:900;letter-spacing:.14em}.back,.btn{padding:12px 15px;border:1px solid var(--line);border-radius:999px;font-size:11px;letter-spacing:.15em;text-transform:uppercase}.main{max-width:1120px;margin:auto;padding:28px 18px 80px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.visual,.card{border:1px solid var(--line);border-radius:28px;overflow:hidden}.visual{min-height:430px;position:relative;background:#111}.visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(7,7,10,.66))}.card{padding:28px;background:rgba(255,255,255,.028)}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(48px,8vw,92px);line-height:.87;letter-spacing:-.055em;margin:12px 0}h2{font-size:28px;color:var(--accent);margin:0 0 18px}.meta,.actions{display:flex;gap:9px;flex-wrap:wrap}.meta span{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.06);font-size:10px;letter-spacing:.13em;text-transform:uppercase}.actions{margin-top:22px}.btn.primary{background:var(--lime);color:#111;border-color:transparent;font-weight:900}.story{display:grid;gap:16px;margin-top:24px}.story .card p{font-size:19px;line-height:1.65;color:#ddd7e2;margin:0}.more{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}.mini{padding:18px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.025)}.mini p{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}.mini h3{font-size:24px;line-height:1;margin:10px 0 0}@media(max-width:850px){.hero,.more{grid-template-columns:1fr}}</style></head><body><header class="header"><div class="header-in"><a class="wordmark" href="index.html">DJ SIR GAY</a><a class="back" href="index.html#projects">← Back to Projects</a></div></header><main class="main"><div class="hero" id="hero"></div><section class="story" id="story"></section><section class="more" id="more"></section></main><script>const projects=[{slug:'belarus-in-exile',eyebrow:'BURNING MAN 2025 / NARRATIVE DJ SET',title:'BELARUS IN EXILE',subtitle:'From Dictatorship to the Dancefloor',short:'A two-hour journey through 55 Belarusian-language tracks — memory, resistance, desire and release, rebuilt for the playa.',story:['This is not a nostalgia set. It is a country carried through sound.','Created for the first Belarusian camp at Burning Man 2025, the mix moves through five emotional chapters: the homeland remembered, pressure and rupture, escape, exile, and finally the freedom of the dancefloor.','Fifty-five Belarusian-language tracks are reshaped through beatmatching, transitions, FX automation and live-set architecture into one continuous two-hour statement: culture survives when people keep hearing it.'],meta:['2:18:17','55 Belarusian tracks','Burning Man 2025'],youtube:'https://youtu.be/5QEXd8XTPM0',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/5QEXd8XTPM0/maxresdefault.jpg',accent:'var(--yellow)'},{slug:'fresh-mashups',eyebrow:'CONTINUOUSLY UPDATED',title:'FRESH MASHUPS',subtitle:'New collisions. No genre borders.',short:'The newest DJ Sir Gay reworks, organized as a living stream rather than a static archive.',story:['Pop memory meets the wrong song at exactly the right moment.','Fresh Mashups is the living part of the site: new releases are meant to follow a dedicated YouTube playlist in exactly the order you choose.','The series moves between global pop, queer classics, Eastern European hits and unexpected cinematic references — always built around a hook strong enough to survive the collision.'],meta:['Playlist-controlled','New releases','No genre borders'],youtube:'https://www.youtube.com/@NostalgAiRec',soundcloud:'https://soundcloud.com/djsirgay',img:'https://i1.sndcdn.com/artworks-1OMNtfFEwWn6Eazf-AQVVBQ-t1080x1080.jpg',accent:'var(--orange)'},{slug:'serebro-925',eyebrow:'LIVE ALBUM / PART I',title:'SEREBRO — 925',subtitle:'Live Part 1',short:'A continuous high-gloss live mixtape that rebuilds SEREBRO’s catalog through mashups, re-edits and club transitions.',story:['SEREBRO — 925 treats a pop catalog as raw material for a new live album.','Familiar vocals are reframed through alternate instrumentals, hard cuts, extended transitions and reworked peaks. Instead of a playlist of songs, the project behaves like one performance with its own pace, tension and release.','Part I introduces the world of 925: metallic, emotional, playful and designed to move in one uninterrupted line.'],meta:['Live mixtape','Part I','Pop reconstruction'],youtube:'https://youtu.be/Mc3C-jRqcP8',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/Mc3C-jRqcP8/maxresdefault.jpg',accent:'var(--blue)'},{slug:'tatu-wm',eyebrow:'ANNIVERSARY REWORK',title:'t.A.T.u. — WM',subtitle:'10th Anniversary Version',short:'A continuous rework of the Waste Management universe — darker, cinematic and rebuilt as a single emotional trip.',story:['Waste Management was already conceived as a continuous journey. This anniversary version pushes that architecture further.','Transitions are redesigned, tension is stretched, and the album’s colder electronic palette is treated like a film score for a night that keeps changing shape.','The result is less a conventional remix collection than one uninterrupted emotional system: intimate, industrial and built for headphones as much as the dancefloor.'],meta:['Continuous mix','Cinematic','Anniversary version'],youtube:'https://youtu.be/0x5QZhKwQPg',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/0x5QZhKwQPg/maxresdefault.jpg',accent:'var(--violet)'}];const slug=new URLSearchParams(location.search).get('slug')||projects[0].slug;const p=projects.find(x=>x.slug===slug)||projects[0];document.title=`DJ Sir Gay — ${p.title}`;document.getElementById('hero').innerHTML=`<div class="visual"><img src="${p.img}" alt="${p.title}"></div><div class="card" style="--accent:${p.accent}"><div class="eyebrow">${p.eyebrow}</div><h1>${p.title}</h1><h2>${p.subtitle}</h2><div class="meta">${p.meta.map(x=>`<span>${x}</span>`).join('')}</div><p style="font-size:20px;color:#ddd7e2">${p.short}</p><div class="actions"><a class="btn primary" href="${p.youtube}" target="_blank" rel="noreferrer">Listen Now ▶</a><a class="btn" href="${p.soundcloud}" target="_blank" rel="noreferrer">SoundCloud ↗</a><a class="btn" href="index.html#booking">Book This Concept</a></div></div>`;document.getElementById('story').innerHTML=p.story.map(x=>`<div class="card"><p>${x}</p></div>`).join('');document.getElementById('more').innerHTML=projects.filter(x=>x.slug!==p.slug).map(x=>`<a class="mini" href="project.html?slug=${x.slug}"><p>Other project</p><h3>${x.title}</h3></a>`).join('');</script></body></html>
