<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07070a" />
  <title>DJ Sir Gay — Project Story</title>
  <meta name="description" content="Listen to a DJ Sir Gay project and read the story behind the sound." />
  <link rel="canonical" href="https://djsirgay.com/project.html" />
  <style>
    :root{--bg:#07070a;--ink:#f7f4ee;--muted:#aaa5b3;--line:rgba(255,255,255,.13);--lime:#b8ff35;--yellow:#ffed00;--orange:#ff922e;--pink:#ff1493;--blue:#48bff2;--violet:#9b72ff}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
    .header{position:sticky;top:0;z-index:40;background:rgba(7,7,10,.82);backdrop-filter:blur(16px);border-top:5px solid var(--accent,var(--lime));border-bottom:1px solid var(--line)}
    .header-in{max-width:1180px;margin:auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:16px}.wordmark{font-weight:950;letter-spacing:.14em}.back,.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 15px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.back:hover,.btn:hover{border-color:var(--accent,var(--lime))}
    .main{max-width:1180px;margin:auto;padding:28px 18px 90px}.player{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:#000;box-shadow:0 30px 90px rgba(0,0,0,.42)}.player iframe{width:100%;height:100%;border:0}
    .intro{display:grid;grid-template-columns:1.08fr .92fr;gap:20px;margin-top:20px}.visual,.card{border:1px solid var(--line);border-radius:28px;overflow:hidden;background:rgba(255,255,255,.028)}.visual{min-height:420px;position:relative}.visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(7,7,10,.76))}.card{padding:clamp(24px,4vw,42px)}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(50px,8vw,98px);line-height:.86;letter-spacing:-.06em;margin:14px 0}h2{font-size:clamp(23px,3vw,34px);color:var(--accent);margin:0 0 18px}.summary{font-size:19px;line-height:1.55;color:#ddd7e2}.meta,.actions{display:flex;gap:9px;flex-wrap:wrap}.meta span{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.06);font-size:10px;letter-spacing:.13em;text-transform:uppercase}.actions{margin-top:24px}.btn.primary{background:var(--lime);color:#090909;border-color:transparent}.btn.youtube{background:#ff0033;color:#fff;border-color:transparent}
    .story{display:grid;gap:16px;margin-top:24px}.story .card p{font-size:clamp(17px,2vw,21px);line-height:1.68;color:#ddd7e2;margin:0}.story .card:first-child{border-left:4px solid var(--accent)}
    .more-head{margin:54px 0 18px}.more-head p{font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}.more-head h3{font-size:clamp(34px,5vw,64px);line-height:.95;margin:8px 0}.more{display:grid;grid-auto-flow:column;grid-auto-columns:min(78vw,360px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:16px}.mini{scroll-snap-align:start;min-height:200px;padding:22px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.025)}.mini:hover{border-color:var(--lime)}.mini p{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}.mini h4{font-size:28px;line-height:1;margin:38px 0 0}
    @media(max-width:850px){.intro{grid-template-columns:1fr}.visual{min-height:340px}.main{padding-inline:14px}.header-in{padding-inline:14px}.back{font-size:9px;padding:10px 12px}.player{border-radius:20px}.card,.visual{border-radius:22px}}
  </style>
</head>
<body>
  <header class="header" id="header"><div class="header-in"><a class="wordmark" href="/">DJ SIR GAY</a><a class="back" href="/#projects">← Back to Projects</a></div></header>
  <main class="main">
    <section class="player" id="player"></section>
    <section class="intro"><div class="visual" id="visual"></div><div class="card" id="copy"></div></section>
    <section class="story" id="story"></section>
    <div class="more-head"><p>Continue listening</p><h3>Other projects</h3></div><section class="more" id="more"></section>
  </main>
  <script>
    const projects=[
      {slug:'belarus-in-exile',eyebrow:'BURNING MAN 2025 / NARRATIVE DJ SET',title:'BELARUS IN EXILE',subtitle:'From Dictatorship to the Dancefloor',short:'A two-hour journey through 55 Belarusian-language tracks — memory, resistance, desire and release, rebuilt for the playa.',story:['This is not nostalgia. It is a country carried through sound.','Created for the first Belarusian camp at Burning Man 2025, the mix moves through six emotional chapters: homeland, pressure, rupture, escape, exile and the freedom of the dancefloor.','Fifty-five Belarusian-language tracks are reshaped through beatmatching, transitions and live-set architecture into one continuous statement against censorship and the forced disappearance of artists. Culture survives when people keep hearing it.'],meta:['2:18:17','55 Belarusian tracks','Burning Man 2025'],youtube:'https://youtu.be/5QEXd8XTPM0',embed:'5QEXd8XTPM0',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/5QEXd8XTPM0/maxresdefault.jpg',accent:'var(--yellow)'},
      {slug:'fresh-mashups',eyebrow:'CONTINUOUSLY UPDATED',title:'FRESH MASHUPS',subtitle:'New collisions. No genre borders.',short:'The newest DJ Sir Gay reworks, organized as a living stream rather than a static archive.',story:['Pop memory meets the wrong song at exactly the right moment.','The Fresh Mashups feed moves between global pop, queer classics, Eastern European hits and unexpected cinematic references. The order is controlled by the dedicated YouTube playlist.','The principle is simple: familiar material is not preserved unchanged. It is placed into a new emotional and rhythmic context, with a hook strong enough to survive the collision.'],meta:['Playlist-controlled','New releases','No genre borders'],youtube:'https://www.youtube.com/playlist?list=PL0CwuGTt2ZV2v4CGRTtYyaWYyCEoC2vPU',embed:'videoseries?list=PL0CwuGTt2ZV2v4CGRTtYyaWYyCEoC2vPU',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/24_RoSB5I1w/maxresdefault.jpg',accent:'var(--orange)'},
      {slug:'serebro-925',eyebrow:'LIVE ALBUM / PART I',title:'SEREBRO — 925',subtitle:'DJ Sir Gay MixTape',short:'A continuous high-gloss mixtape rebuilding SEREBRO’s catalog through mashups, re-edits and club transitions.',story:['SEREBRO — 925 treats a pop catalog as raw material for a new live album.','Familiar vocals are reframed through alternate instrumentals, hard cuts, extended transitions and redesigned peaks. Instead of a list of songs, the project behaves like one performance with its own pace, tension and release.','Part I introduces the world of 925: metallic, emotional, playful and designed to move in one uninterrupted line.'],meta:['Live mixtape','Part I','Pop reconstruction'],youtube:'https://youtu.be/Mc3C-jRqcP8',embed:'Mc3C-jRqcP8',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/Mc3C-jRqcP8/maxresdefault.jpg',accent:'var(--blue)'},
      {slug:'tatu-wm',eyebrow:'ANNIVERSARY REWORK',title:'t.A.T.u. — WM',subtitle:'10th Anniversary Version',short:'A darker, cinematic continuous rework of the Waste Management universe — rebuilt as one emotional trip.',story:['Waste Management was already conceived as a continuous journey. This anniversary version pushes that architecture further.','Transitions are redesigned, tension is stretched, and the album’s colder electronic palette is treated like a film score for a night that keeps changing shape.','The result is less a conventional remix collection than one uninterrupted emotional system: intimate, industrial and built for headphones as much as the dancefloor.'],meta:['Continuous mix','Cinematic','Anniversary version'],youtube:'https://youtu.be/0x5QZhKwQPg',embed:'0x5QZhKwQPg',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/0x5QZhKwQPg/maxresdefault.jpg',accent:'var(--violet)'}
    ];
    const slug=new URLSearchParams(location.search).get('slug')||projects[0].slug;const p=projects.find(item=>item.slug===slug)||projects[0];document.title=`DJ Sir Gay — ${p.title}`;document.documentElement.style.setProperty('--accent',p.accent);document.getElementById('header').style.setProperty('--accent',p.accent);
    const embed=p.embed.startsWith('videoseries')?`https://www.youtube.com/embed/${p.embed}`:`https://www.youtube.com/embed/${p.embed}?rel=0`;
    document.getElementById('player').innerHTML=`<iframe src="${embed}" title="Listen to ${p.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
    document.getElementById('visual').innerHTML=`<img src="${p.img}" alt="${p.title}">`;
    document.getElementById('copy').innerHTML=`<div class="eyebrow">${p.eyebrow}</div><h1>${p.title}</h1><h2>${p.subtitle}</h2><div class="meta">${p.meta.map(item=>`<span>${item}</span>`).join('')}</div><p class="summary">${p.short}</p><div class="actions"><a class="btn youtube" href="${p.youtube}" target="_blank" rel="noreferrer">Open on YouTube ↗</a><a class="btn" href="${p.soundcloud}" target="_blank" rel="noreferrer">SoundCloud ↗</a><a class="btn primary" href="/#booking">Book This Concept</a></div>`;
    document.getElementById('story').innerHTML=p.story.map(text=>`<div class="card"><p>${text}</p></div>`).join('');
    document.getElementById('more').innerHTML=projects.filter(item=>item.slug!==p.slug).map(item=>`<a class="mini" href="/project.html?slug=${item.slug}"><p>${item.eyebrow}</p><h4>${item.title}</h4></a>`).join('');
  </script>
</body>
</html>
