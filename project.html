<body>
  <header class="header"><div class="header-in"><a class="wordmark" href="/">DJ SIR GAY / SIGNAL FILE</a><a class="back" href="/#projects">← Back to transmissions</a></div></header>
  <main class="main">
    <p class="file-label" id="file-label">Loading project evidence / DJSG archive</p>
    <section class="player" id="player"></section>
    <section class="intro"><div class="visual" id="visual"></div><div class="copy" id="copy"></div></section>

    <div class="more-head"><p>Continue intercepting</p><h3>Other project files</h3></div>
    <section class="more" id="more"></section>
  </main>
  <script>
    const projects=[
      {slug:'belarus-in-exile',eyebrow:'BURNING MAN 2025 / NARRATIVE DJ SET',title:'BELARUS IN EXILE',subtitle:'From Dictatorship to the Dancefloor',short:'A two-hour journey through 55 Belarusian-language tracks — memory, resistance, desire and release, rebuilt for the playa.',story:['This is not nostalgia. It is a country carried through sound.','Created for the first Belarusian camp at Burning Man 2025, the mix moves through six emotional chapters: homeland, pressure, rupture, escape, exile and the freedom of the dancefloor.','Fifty-five Belarusian-language tracks are reshaped through beatmatching, transitions and live-set architecture into one continuous statement against censorship and the forced disappearance of artists. Culture survives when people keep hearing it.'],meta:['2:18:17','55 Belarusian tracks','Burning Man 2025'],youtube:'https://youtu.be/5QEXd8XTPM0',embed:'5QEXd8XTPM0',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/5QEXd8XTPM0/maxresdefault.jpg'},
      {slug:'fresh-mashups',eyebrow:'CONTINUOUSLY UPDATED',title:'FRESH MASHUPS',subtitle:'New collisions. No genre borders.',short:'The newest DJ Sir Gay reworks, organized as a living stream rather than a static archive.',story:['Pop memory meets the wrong song at exactly the right moment.','The Fresh Mashups feed moves between global pop, queer classics, Eastern European hits and unexpected cinematic references. The order is controlled by the dedicated YouTube playlist.','The principle is simple: familiar material is not preserved unchanged. It is placed into a new emotional and rhythmic context, with a hook strong enough to survive the collision.'],meta:['Playlist-controlled','New releases','No genre borders'],youtube:'https://www.youtube.com/playlist?list=PL0CwuGTt2ZV2v4CGRTtYyaWYyCEoC2vPU',embed:'videoseries?list=PL0CwuGTt2ZV2v4CGRTtYyaWYyCEoC2vPU',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/24_RoSB5I1w/maxresdefault.jpg'},
      {slug:'serebro-925',eyebrow:'LIVE ALBUM / PART I',title:'SEREBRO — 925',subtitle:'DJ Sir Gay MixTape',short:'A continuous high-gloss mixtape rebuilding SEREBRO’s catalog through mashups, re-edits and club transitions.',story:['SEREBRO — 925 treats a pop catalog as raw material for a new live album.','Familiar vocals are reframed through alternate instrumentals, hard cuts, extended transitions and redesigned peaks. Instead of a list of songs, the project behaves like one performance with its own pace, tension and release.','Part I introduces the world of 925: metallic, emotional, playful and designed to move in one uninterrupted line.'],meta:['Live mixtape','Part I','Pop reconstruction'],youtube:'https://youtu.be/Mc3C-jRqcP8',embed:'Mc3C-jRqcP8',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/Mc3C-jRqcP8/maxresdefault.jpg'},
      {slug:'tatu-wm',eyebrow:'ANNIVERSARY REWORK',title:'t.A.T.u. — WM',subtitle:'10th Anniversary Version',short:'A darker, cinematic continuous rework of the Waste Management universe — rebuilt as one emotional trip.',story:['Waste Management was already conceived as a continuous journey. This anniversary version pushes that architecture further.','Transitions are redesigned, tension is stretched, and the album’s colder electronic palette is treated like a film score for a night that keeps changing shape.','The result is less a conventional remix collection than one uninterrupted emotional system: intimate, industrial and built for headphones as much as the dancefloor.'],meta:['Continuous mix','Cinematic','Anniversary version'],youtube:'https://youtu.be/0x5QZhKwQPg',embed:'0x5QZhKwQPg',soundcloud:'https://soundcloud.com/djsirgay',img:'https://img.youtube.com/vi/0x5QZhKwQPg/maxresdefault.jpg'}
    ];
    const slug=new URLSearchParams(location.search).get('slug')||projects[0].slug;
    const p=projects.find(item=>item.slug===slug)||projects[0];
    document.title=`DJ Sir Gay — ${p.title}`;
    document.getElementById('file-label').textContent=`Project file / ${String(projects.indexOf(p)+1).padStart(2,'0')} of ${String(projects.length).padStart(2,'0')} / Signal recovered`;
    const embed=p.embed.startsWith('videoseries')?`https://www.youtube.com/embed/${p.embed}`:`https://www.youtube.com/embed/${p.embed}?rel=0`;
    document.getElementById('player').innerHTML=`<iframe src="${embed}" title="Listen to ${p.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
    document.getElementById('visual').innerHTML=`<img src="${p.img}" alt="${p.title}">`;
    document.getElementById('copy').innerHTML=`<div><div class="eyebrow">${p.eyebrow}</div><h1>${p.title}</h1><h2>${p.subtitle}</h2><div class="meta">${p.meta.map(item=>`<span>${item}</span>`).join('')}</div><p class="summary">${p.short}</p></div><div class="actions"><a class="btn primary" href="${p.youtube}" target="_blank" rel="noreferrer">Open on YouTube ↗</a><a class="btn" href="${p.soundcloud}" target="_blank" rel="noreferrer">SoundCloud ↗</a><a class="btn" href="/#booking">Book this signal</a></div>`;
    document.getElementById('story').innerHTML=p.story.map(text=>`<article class="log"><p>${text}</p></article>`).join('');
    document.getElementById('more').innerHTML=projects.filter(item=>item.slug!==p.slug).map(item=>`<a class="mini" href="/project.html?slug=${item.slug}"><p>${item.eyebrow}</p><h4>${item.title}</h4></a>`).join('');
  </script>
</body>
</html>
