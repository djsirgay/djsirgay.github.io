    .error-desktop{min-height:calc(100vh - 46px);min-height:calc(100svh - 46px);display:grid;place-items:center;padding:24px 16px}

    .error-contact{display:inline-block;color:var(--navy);text-underline-offset:3px}

    .error-window .statusbar{font-size:10px;line-height:1.4}
    @media(max-width:560px){.error-copy{padding:22px 18px}.error-copy .buttons{grid-template-columns:1fr}.error-desktop{padding:18px 12px}}
