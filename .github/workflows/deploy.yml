name: Deploy DJ Sir Gay site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

          # Build a small JSON feed in the exact order of the selected
          # YouTube playlist. Failure is non-fatal: the page keeps its
          # curated fallback release cards.
          python -m pip install --quiet yt-dlp
          if yt-dlp --flat-playlist --dump-single-json \
            'https://www.youtube.com/playlist?list=PL0CwuGTt2ZV2v4CGRTtYyaWYyCEoC2vPU' \
            > /tmp/dj-playlist.json; then
            python - <<'PY'
          import json
          from pathlib import Path

          playlist_id = 'PL0CwuGTt2ZV2v4CGRTtYyaWYyCEoC2vPU'
          data = json.loads(Path('/tmp/dj-playlist.json').read_text())
          items = []
          for entry in data.get('entries') or []:
              video_id = entry.get('id')
              if not video_id:
                  continue
              items.append({
                  'id': video_id,
                  'title': entry.get('title') or 'DJ Sir Gay release',
                  'url': f'https://www.youtube.com/watch?v={video_id}&list={playlist_id}',
                  'thumbnail': f'https://i.ytimg.com/vi/{video_id}/hqdefault.jpg',
              })
          Path('_site/fresh-releases.json').write_text(
              json.dumps({'playlist_id': playlist_id, 'items': items}, ensure_ascii=False),
              encoding='utf-8',
          )
          PY
          else
            echo 'YouTube playlist sync failed; keeping embedded fallback cards.'
          fi

          # Load the generated playlist renderer after the page's main script.
          perl -0pi -e 's#</body>#  <script src="/fresh-sync.js?v=20260729-2"></script>\n</body>#' _site/index.html

          printf 'djsirgay.com\n' > _site/CNAME
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
