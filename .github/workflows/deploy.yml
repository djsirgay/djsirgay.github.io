name: Deploy DJ Sir Gay site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

          # Playlist enrichment is optional. A temporary pip or YouTube failure
          # must never prevent the site from reaching GitHub Pages.
          if python -m pip install --quiet yt-dlp && \
             yt-dlp --flat-playlist --dump-single-json \
             'https://www.youtube.com/playlist?list=PL0CwuGTt2ZV2v4CGRTtYyaWYyCEoC2vPU' \
             > /tmp/dj-playlist.json; then
            python - <<'PY'
          import json
          from pathlib import Path

          playlist_id = 'PL0CwuGTt2ZV2v4CGRTtYyaWYyCEoC2vPU'
          data = json.loads(Path('/tmp/dj-playlist.json').read_text())

          def format_duration(value):
              if value in (None, ''):
                  return ''
              try:
                  seconds = int(float(value))
              except (TypeError, ValueError):
                  return str(value)
              hours, remainder = divmod(seconds, 3600)
              minutes, secs = divmod(remainder, 60)
              return f'{hours}:{minutes:02d}:{secs:02d}' if hours else f'{minutes}:{secs:02d}'

          items = []
          for entry in data.get('entries') or []:
              video_id = entry.get('id')
              if not video_id:
                  continue
              items.append({
                  'id': video_id,
                  'title': entry.get('title') or 'DJ Sir Gay release',
                  'duration': format_duration(entry.get('duration')),
                  'url': f'https://www.youtube.com/watch?v={video_id}&list={playlist_id}',
                  'thumbnail': f'https://i.ytimg.com/vi/{video_id}/hqdefault.jpg',
              })

          Path('_site/fresh-releases.json').write_text(
              json.dumps({'playlist_id': playlist_id, 'items': items}, ensure_ascii=False),
              encoding='utf-8',
          )
          PY
          else
            echo 'Playlist enrichment unavailable; publishing curated fallback cards.'
          fi

          # Keep source files readable while forcing fresh public runtime URLs.
          perl -0pi -e 's#signal\.js\?v=[^"[:space:]]+#signal.js?v=20260810-7#g' _site/index.html
          perl -0pi -e 's#hierarchy95\.css\?v=20260810-1#hierarchy95.css?v=20260810-5#g; s#hierarchy95\.js\?v=20260810-1#hierarchy95.js?v=20260810-5#g' _site/signal.js
          perl -0pi -e 's#project-dramaturgy\.css\?v=[^"[:space:]]+#project-dramaturgy.css?v=20260810-5#g' _site/project.html
          perl -0pi -e 's#project-direct\.css\?v=[^"[:space:]]+#project-direct.css?v=20260810-5#g' _site/project.html

          printf 'djsirgay.com\n' > _site/CNAME
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4