name: Deploy DJ Sir Gay site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mirror published site and add independent preview
        run: |
          mkdir -p _site
          wget --mirror --convert-links --adjust-extension --page-requisites --no-parent \
            --directory-prefix=_mirror https://djsirgay.lovable.app/
          cp -a _mirror/djsirgay.lovable.app/. _site/

          # Keep the current Lovable site at the root, but publish the
          # independent GitHub-hosted build at /preview/ for approval.
          mkdir -p _site/preview _site/assets
          cp -a preview/. _site/preview/
          cp -a assets/. _site/assets/
          cp project.html _site/project.html

          # Load the independent hero visual after the original stylesheet.
          perl -0pi -e 's#</head>#  <link rel="stylesheet" href="/preview/hero.css?v=1" />\n</head>#' _site/preview/index.html

          printf 'djsirgay.com\n' > _site/CNAME
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
