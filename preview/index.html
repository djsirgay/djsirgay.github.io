<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>DJ Sir Gay — Independent Preview</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#050505}
  </style>
</head>
<body>
  <iframe id="site" src="/preview-old/?v=1" title="DJ Sir Gay independent preview" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
  <script>
    const frame=document.getElementById('site');
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        const link=doc.createElement('link');
        link.rel='stylesheet';
        link.href='/preview/hero.css?v=3';
        doc.head.appendChild(link);
      }catch(error){console.error(error)}
    });
  </script>
</body>
</html>
